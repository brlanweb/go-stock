services:
  go-stock:
    build: .
    image: go-stock:latest
    container_name: go-stock
    restart: unless-stopped
    ports:
      - "8480:8480"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    # 内存限制：目标 <50MB，上限给 256MB 冗余
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    container_name: go-stock-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 160M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  redis-data:
